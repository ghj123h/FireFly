name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.304

      - name: Restore
        run: dotnet restore FireFly.sln

      - name: Build
        run: dotnet build FireFly.sln -c Release --no-restore -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true

      - name: Run smoke tests
        shell: pwsh
        run: ./test.ps1 -Configuration Release

      - name: Verify expanded source
        shell: pwsh
        run: ./verify-combined.ps1 -Configuration Release

      - name: Pack
        run: dotnet pack FireFly/FireFly.csproj -c Release --no-build --no-restore -o artifacts/packages -p:RepositoryCommit=${{ github.sha }} -p:ContinuousIntegrationBuild=true

      - name: Verify packed package
        shell: pwsh
        run: ./verify-package.ps1 -Configuration Release

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Soy.FireFly-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
